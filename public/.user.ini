; Increase PHP upload limits for production.
; Note: This works on hosts that support per-directory .user.ini (PHP-FPM/CGI).
; For Nginx/Apache config limits (client_max_body_size / LimitRequestBody), adjust server config too.

upload_max_filesize=1024M
post_max_size=1024M
memory_limit=1024M
max_execution_time=600
max_input_time=600

