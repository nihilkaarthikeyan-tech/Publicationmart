<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PublicationMart — a cloth-bound book: oxblood cover, gold blind-tooled
       frame, serif P in foil. Matches the 2.0 publishing-house identity. -->
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a2935"/>
      <stop offset="0.55" stop-color="#6e2530"/>
      <stop offset="1" stop-color="#4d1a22"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8cf8e"/>
      <stop offset="0.5" stop-color="#d4b26a"/>
      <stop offset="1" stop-color="#b08d45"/>
    </linearGradient>
  </defs>

  <!-- page block peeking at the right edge -->
  <rect x="57" y="6" width="4" height="52" rx="1.5" fill="#efe9db"/>
  <rect x="57" y="6" width="4" height="52" rx="1.5" fill="none" stroke="#cfc6b0" stroke-width="0.8"/>

  <!-- the cover -->
  <rect x="3" y="3" width="56" height="58" rx="6" fill="url(#cloth)"/>

  <!-- spine shading on the hinge -->
  <rect x="3" y="3" width="10" height="58" rx="6" fill="url(#spine)"/>

  <!-- blind-tooled double frame -->
  <rect x="10.5" y="9.5" width="42" height="45" rx="2.5" fill="none" stroke="#e8cf8e" stroke-opacity="0.85" stroke-width="1.6"/>
  <rect x="14" y="13" width="35" height="38" rx="1.5" fill="none" stroke="#e8cf8e" stroke-opacity="0.4" stroke-width="1"/>

  <!-- the letter, foil-blocked -->
  <text x="33" y="43.5" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold"
        fill="url(#foil)">P</text>
</svg>
